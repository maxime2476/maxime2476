<svg xmlns="http://www.w3.org/2000/svg" width="900" height="212" viewBox="0 0 900 212" role="img" aria-label="Pipeline de segmentation : 8000 images de recifs, YOLO, SAM 3, 92 pour cent de precision">
  <style>
  .rise{animation:rise .55s cubic-bezier(.22,.61,.36,1) both}
  .wipe{animation:wipe 1.3s cubic-bezier(.22,.61,.36,1) both}
  .halo{animation:halo 2.6s ease-out .9s infinite}
  .travel{animation:travel 5s linear infinite}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes halo{0%{r:3.6;opacity:.55}70%{r:13;opacity:0}100%{r:13;opacity:0}}
  @keyframes travel{from{opacity:.85;transform:translateX(0)}to{opacity:.85;transform:translateX(812px)}}
  @media (prefers-reduced-motion: reduce){
    .rise,.wipe,.halo,.travel{animation:none}
  }
</style>
  <rect x="0.5" y="0.5" width="899" height="211" rx="14" fill="#0E1116" stroke="#222A33"/>
  <text x="44" y="46" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.8" fill="#F97316">STAGE AUBAY &#183; SEGMENTATION DE R&#201;CIFS CORALLIENS</text>
  <circle class="travel" cx="44" cy="108" r="3.2" fill="#F97316" opacity="0"/><line x1="230" y1="108" x2="260" y2="108" stroke="#8B949E" stroke-width="1.4"/><path d="M260,108 L254,104.5 L254,111.5 Z" fill="#8B949E"/><line x1="430" y1="108" x2="460" y2="108" stroke="#8B949E" stroke-width="1.4"/><path d="M460,108 L454,104.5 L454,111.5 Z" fill="#8B949E"/><line x1="630" y1="108" x2="660" y2="108" stroke="#8B949E" stroke-width="1.4"/><path d="M660,108 L654,104.5 L654,111.5 Z" fill="#8B949E"/><g class="rise" style="animation-delay:0.12s"><rect x="44" y="78" width="186" height="60" rx="10" fill="#141A21" stroke="#222A33" stroke-width="1"/><text x="137.0" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#E9EDF2" text-anchor="middle">8 000 images</text><text x="137.0" y="124" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#8B949E" text-anchor="middle">r&#233;cifs coralliens</text></g><g class="rise" style="animation-delay:0.28s"><rect x="270" y="78" width="160" height="60" rx="10" fill="#141A21" stroke="#222A33" stroke-width="1"/><text x="350.0" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#E9EDF2" text-anchor="middle">YOLO</text><text x="350.0" y="124" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#8B949E" text-anchor="middle">d&#233;tection</text></g><g class="rise" style="animation-delay:0.44s"><rect x="470" y="78" width="160" height="60" rx="10" fill="#141A21" stroke="#222A33" stroke-width="1"/><text x="550.0" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#E9EDF2" text-anchor="middle">SAM 3</text><text x="550.0" y="124" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#8B949E" text-anchor="middle">masques</text></g><g class="rise" style="animation-delay:0.6s"><rect x="670" y="78" width="186" height="60" rx="10" fill="#141A21" stroke="#F97316" stroke-width="1.6"/><text x="763.0" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#F97316" text-anchor="middle">92 %</text><text x="763.0" y="124" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#8B949E" text-anchor="middle">de pr&#233;cision</text></g><path d="M44,150 V157 H230 V150" fill="none" stroke="#1B222B" stroke-width="1.4"/><path d="M270,150 V157 H630 V150" fill="none" stroke="#1B222B" stroke-width="1.4"/><text x="137" y="174" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#8B949E" text-anchor="middle">pr&#233;paration des donn&#233;es</text><text x="137" y="188" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#8B949E" text-anchor="middle">automatis&#233;e : 6 h de moins par cycle</text><text x="450" y="174" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#8B949E" text-anchor="middle">d&#233;fauts ajout&#233;s pendant l&#8217;entra&#238;nement :</text><text x="450" y="188" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#8B949E" text-anchor="middle">flou et dominante bleu-vert de l&#8217;eau</text>
</svg>
