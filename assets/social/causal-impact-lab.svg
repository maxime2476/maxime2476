  <text x="90" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#E9EDF2">Does raising interest rates</text><text x="90" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#E9EDF2">actually destroy jobs?</text><text x="90" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="24" fill="#8B949E">The expected sign everywhere, too imprecise to conclude.</text><text x="90" y="464" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="24" fill="#8B949E">The null result is published as the finding.</text>
