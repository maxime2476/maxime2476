<svg xmlns="http://www.w3.org/2000/svg" width="212" height="116" viewBox="0 0 212 116" role="img" aria-label="causal-impact-lab">
  <style>
  .rise{animation:rise .55s cubic-bezier(.22,.61,.36,1) both}
  .wipe{animation:wipe 1.3s cubic-bezier(.22,.61,.36,1) both}
  .halo{animation:halo 2.6s ease-out .9s infinite}
  .travel{animation:travel 5s linear infinite}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes halo{0%{r:3.6;opacity:.55}70%{r:13;opacity:0}100%{r:13;opacity:0}}
  @keyframes travel{from{opacity:.85;transform:translateX(0)}to{opacity:.85;transform:translateX(812px)}}
  @media (prefers-reduced-motion: reduce){
    .rise,.wipe,.halo,.travel{animation:none}
  }
</style>
  <rect x="0.5" y="0.5" width="211" height="115" rx="12" fill="#FDFCFB" stroke="#E5E1DA"/>
  <g class="rise">
    <text x="16" y="26" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#C2410C">causal-impact-lab</text>
    <text x="16" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6B655E">un effet trop impr&#233;cis</text>
    <text x="16" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6B655E">pour conclure</text>
  </g>
  <g class="wipe" style="animation-delay:.3s"><path d="M 16,74 L 46,70 L 76,66 L 106,72 L 136,68 L 166,71 L 196,69 L 196,90 L 166,94 L 136,92 L 106,96 L 76,90 L 46,88 L 16,86 Z" fill="#C2410C" fill-opacity="0.18"/><line x1="16" y1="80" x2="196" y2="80" stroke="#6B655E" stroke-width="1" opacity="0.6"/><path d="M 16,80 L 46,79 L 76,78 L 106,84 L 136,80 L 166,82 L 196,79" fill="none" stroke="#C2410C" stroke-width="1.8"/></g>
</svg>
