<svg viewBox="0 0 900 300" width="900" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maxime Gourguechon — Data Scientist. Nuage de points sans tendance, droite ajustée quasi plate et intervalle de confiance large recouvrant zéro : le résultat nul pré-enregistré de causal-impact-lab.">
  <style>
    /* Palette (light par défaut, dark via media query) */
    .name   { fill:#24292f; font: 700 34px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sub    { fill:#57606a; font: 400 15px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .term   { fill:#57606a; font: 400 14px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .result { fill:#0969DA; font: 700 14px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .axlab  { fill:#57606a; font: 400 11px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .grid   { stroke:#d0d7de; stroke-width:0.6; }
    .zero   { stroke:#57606a; stroke-width:1.2; stroke-dasharray:5 4; }
    .pt     { fill:#0969DA; }
    .fit    { stroke:#1F6FEB; stroke-width:2.5; fill:none; }
    .band   { fill:#0969DA; }
    .cursor { fill:#0969DA; }

    @media (prefers-color-scheme: dark) {
      .name { fill:#e6edf3; }
      .sub, .term, .axlab { fill:#9198a1; }
      .grid { stroke:#30363d; }
      .zero { stroke:#9198a1; }
      .pt   { fill:#58A6FF; }
      .fit  { stroke:#58A6FF; }
      .band { fill:#58A6FF; }
      .result, .cursor { fill:#58A6FF; }
    }

    /* Animations */
    .pt   { opacity:0; animation: pop 0.45s ease-out forwards; }
    .fit  { stroke-dasharray:1; stroke-dashoffset:1; animation: draw 1.6s ease-in-out 2.0s forwards; }
    .band { opacity:0; animation: fadeband 1.2s ease-out 3.4s forwards; }
    .zero { opacity:0; animation: fadein 0.6s ease-out 3.4s forwards; }
    .line-a { opacity:0; animation: fadein 0.5s ease-out 0.2s forwards; }
    .line-b { opacity:0; animation: fadein 0.5s ease-out 0.9s forwards; }
    .line-c { opacity:0; animation: fadein 0.5s ease-out 1.6s forwards; }
    .line-d { opacity:0; animation: fadein 0.6s ease-out 3.7s forwards; }
    .cursor { animation: blink 1.1s step-end infinite; }

    @keyframes pop      { to { opacity:1; } }
    @keyframes draw     { to { stroke-dashoffset:0; } }
    @keyframes fadeband { to { opacity:0.14; } }
    @keyframes fadein   { to { opacity:1; } }
    @keyframes blink    { 50% { opacity:0; } }

    /* Accessibilité : tout visible immédiatement si l'utilisateur refuse le mouvement */
    @media (prefers-reduced-motion: reduce) {
      .pt, .line-a, .line-b, .line-c, .line-d, .zero { animation:none; opacity:1; }
      .fit  { animation:none; stroke-dashoffset:0; }
      .band { animation:none; opacity:0.14; }
      .cursor { animation:none; }
    }
  </style>

  <!-- Grille discrète (zone du nuage de points) -->
  <g class="grid">
    <line x1="430" y1="60"  x2="880" y2="60"/>
    <line x1="430" y1="105" x2="880" y2="105"/>
    <line x1="430" y1="195" x2="880" y2="195"/>
    <line x1="430" y1="240" x2="880" y2="240"/>
    <line x1="520" y1="40"  x2="520" y2="260"/>
    <line x1="640" y1="40"  x2="640" y2="260"/>
    <line x1="760" y1="40"  x2="760" y2="260"/>
  </g>

  <!-- Intervalle de confiance : large, et il recouvre la ligne zéro -->
  <polygon class="band" points="430,88 865,74 865,212 430,226"/>

  <!-- Effet nul de référence -->
  <line class="zero" x1="430" y1="150" x2="880" y2="150"/>

  <!-- Nuage de points : aucune tendance lisible -->
  <g>
    <circle class="pt" cx="440" cy="171" r="4" style="animation-delay:0.10s"/>
    <circle class="pt" cx="462" cy="118" r="4" style="animation-delay:0.19s"/>
    <circle class="pt" cx="481" cy="196" r="4" style="animation-delay:0.28s"/>
    <circle class="pt" cx="504" cy="142" r="4" style="animation-delay:0.37s"/>
    <circle class="pt" cx="527" cy="108" r="4" style="animation-delay:0.46s"/>
    <circle class="pt" cx="549" cy="183" r="4" style="animation-delay:0.55s"/>
    <circle class="pt" cx="572" cy="131" r="4" style="animation-delay:0.64s"/>
    <circle class="pt" cx="593" cy="207" r="4" style="animation-delay:0.73s"/>
    <circle class="pt" cx="617" cy="126" r="4" style="animation-delay:0.82s"/>
    <circle class="pt" cx="638" cy="168" r="4" style="animation-delay:0.91s"/>
    <circle class="pt" cx="661" cy="95"  r="4" style="animation-delay:1.00s"/>
    <circle class="pt" cx="684" cy="188" r="4" style="animation-delay:1.09s"/>
    <circle class="pt" cx="706" cy="139" r="4" style="animation-delay:1.18s"/>
    <circle class="pt" cx="729" cy="215" r="4" style="animation-delay:1.27s"/>
    <circle class="pt" cx="751" cy="112" r="4" style="animation-delay:1.36s"/>
    <circle class="pt" cx="773" cy="177" r="4" style="animation-delay:1.45s"/>
    <circle class="pt" cx="796" cy="134" r="4" style="animation-delay:1.54s"/>
    <circle class="pt" cx="818" cy="199" r="4" style="animation-delay:1.63s"/>
    <circle class="pt" cx="841" cy="121" r="4" style="animation-delay:1.72s"/>
    <circle class="pt" cx="859" cy="162" r="4" style="animation-delay:1.81s"/>
  </g>

  <!-- Droite ajustée : quasi plate, indiscernable de zéro -->
  <path class="fit" d="M 430 157 L 865 143" pathLength="1"/>

  <!-- Identité + terminal -->
  <text class="name" x="46" y="78">Maxime Gourguechon</text>
  <text class="sub"  x="48" y="106">Data Scientist · Économétrie × Machine Learning</text>
  <text class="sub"  x="48" y="128">Aubay · MSc Économétrie &amp; Statistiques</text>

  <text class="term line-a" x="48" y="176">&gt; import econometrics as pourquoi</text>
  <text class="term line-b" x="48" y="200">&gt; import machine_learning as comment</text>
  <text class="term line-c" x="48" y="224">&gt; lp.fit(emploi ~ choc × exposition)</text>
  <g class="line-d">
    <text class="result" x="48" y="252">β̂(h=12) = +0.19 · p = 0.996 · nul publié</text>
    <rect class="cursor" x="366" y="240" width="8" height="14"/>
  </g>
</svg>
