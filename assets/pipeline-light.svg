<svg xmlns="http://www.w3.org/2000/svg" width="900" height="212" viewBox="0 0 900 212" role="img" aria-label="Pipeline de segmentation : 8000 images de recifs, YOLO, SAM 3, 92 pour cent de precision"><rect x="0.5" y="0.5" width="899" height="211" rx="14" fill="#FDFCFB" stroke="#E5E1DA"/><text x="44" y="46" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.8" fill="#C2410C">STAGE AUBAY &#183; SEGMENTATION DE R&#201;CIFS CORALLIENS</text><circle r="3.2" fill="#C2410C" opacity="0"><animate attributeName="opacity" values="0.9;0.9" dur="5s" repeatCount="indefinite"/><animateMotion path="M44,108 H856" dur="5s" repeatCount="indefinite"/></circle><line x1="230" y1="108" x2="260" y2="108" stroke="#6B655E" stroke-width="1.4"/><path d="M260,108 L254,104.5 L254,111.5 Z" fill="#6B655E"/><line x1="430" y1="108" x2="460" y2="108" stroke="#6B655E" stroke-width="1.4"/><path d="M460,108 L454,104.5 L454,111.5 Z" fill="#6B655E"/><line x1="630" y1="108" x2="660" y2="108" stroke="#6B655E" stroke-width="1.4"/><path d="M660,108 L654,104.5 L654,111.5 Z" fill="#6B655E"/><g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" from="0 9" to="0 0" begin="0.15s" dur="0.5s" fill="freeze"/><rect x="44" y="78" width="186" height="60" rx="10" fill="#FFFFFF" stroke="#E5E1DA" stroke-width="1"/><text x="137.0" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#17181A" text-anchor="middle">8 000 images</text><text x="137.0" y="124" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#6B655E" text-anchor="middle">r&#233;cifs coralliens</text></g><g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" from="0 9" to="0 0" begin="0.33s" dur="0.5s" fill="freeze"/><rect x="270" y="78" width="160" height="60" rx="10