<svg xmlns="http://www.w3.org/2000/svg" width="212" height="116" viewBox="0 0 212 116" role="img" aria-label="bmw-sales-analytics">
  <style>
  .rise{animation:rise .55s cubic-bezier(.22,.61,.36,1) both}
  .wipe{animation:wipe 1.3s cubic-bezier(.22,.61,.36,1) both}
  .halo{animation:halo 2.6s ease-out .9s infinite}
  .travel{animation:travel 5s linear infinite}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes halo{0%{r:3.6;opacity:.55}70%{r:13;opacity:0}100%{r:13;opacity:0}}
  @keyframes travel{from{opacity:.85;transform:translateX(0)}to{opacity:.85;transform:translateX(812px)}}
  @media (prefers-reduced-motion: reduce){
    .rise,.wipe,.halo,.travel{animation:none}
  }
</style>
  <rect x="0.5" y="0.5" width="211" height="115" rx="12" fill="#FDFCFB" stroke="#E5E1DA"/>
  <g class="rise">
    <text x="16" y="26" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#C2410C">bmw-sales-analytics</text>
    <text x="16" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6B655E">50 000 ventes,</text>
    <text x="16" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6B655E">aucun signal</text>
  </g>
  <g class="wipe" style="animation-delay:.3s"><circle cx="24" cy="68" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="39" cy="92" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="54" cy="74" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="69" cy="96" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="84" cy="66" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="99" cy="88" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="114" cy="72" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="129" cy="94" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="144" cy="70" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="159" cy="90" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="174" cy="78" r="2.2" fill="#6B655E" opacity="0.7"/><circle cx="189" cy="86" r="2.2" fill="#6B655E" opacity="0.7"/><line x1="16" y1="81" x2="196" y2="81" stroke="#C2410C" stroke-width="1.8" stroke-dasharray="5 4"/></g>
</svg>
